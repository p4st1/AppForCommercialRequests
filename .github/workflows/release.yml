name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: MyApp
  PYTHON_VERSION: "3.11"
  WINDOWS_SETUP_ASSET: MyAppSetup.exe

jobs:
  verify:
    name: Verify (tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install test deps
        shell: bash
        run: |
          set -eux
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set -eux
          python -m unittest discover -s tests -v

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos-arm64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Sanity check files
        shell: bash
        run: |
          set -eux
          test -f run.py
          test -f main.py
          test -f requirements.txt
          test -f retrade.ui
          test -d utilities
          test -d database
          test -d templates
          test -f templates/template.xlsx
          test -f templates/template.docx
          test -f templates/template_short.docx
          test -f templates/logs.log
          test -d assets
          test -f assets/app.ico
          test -f assets/app.icns
          test -f assets/app.jpg
          test -f assets/print.png
          test -f assets/sign.png
          test -f assets/updates.txt

      - name: Install deps
        shell: bash
        run: |
          set -eux
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -U pyinstaller PySide6 python-docx

      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eux

          PW_SITE_BROWSERS="$(python -c "from pathlib import Path; import playwright; print(Path(playwright.__file__).resolve().parent / 'driver' / 'package' / '.local-browsers')")"
          python -c "from pathlib import Path; import shutil, sys; shutil.rmtree(Path(sys.argv[1]), ignore_errors=True)" "$PW_SITE_BROWSERS"

          PW_BROWSERS="$(python -c "from pathlib import Path; import os; print(Path(os.environ['RUNNER_TEMP']) / 'playwright-browsers')")"
          python -c "from pathlib import Path; import shutil, sys; shutil.rmtree(Path(sys.argv[1]), ignore_errors=True); Path(sys.argv[1]).mkdir(parents=True, exist_ok=True)" "$PW_BROWSERS"
          PLAYWRIGHT_BROWSERS_PATH="$PW_BROWSERS" python -m playwright install --no-shell chromium
          python -c "from pathlib import Path; import shutil, sys; root=Path(sys.argv[1]); [shutil.rmtree(path, ignore_errors=True) for path in root.glob('ffmpeg-*')]" "$PW_BROWSERS"

          echo "PW_BROWSERS=$PW_BROWSERS" >> "$GITHUB_ENV"
          test -d "$PW_BROWSERS"
          test ! -d "$PW_SITE_BROWSERS"
          test -n "$(find "$PW_BROWSERS" -path "*/chrome.exe" -type f -print -quit)"
          test -z "$(find "$PW_BROWSERS" -path "*/chromium_headless_shell-*" -print -quit)"
          test -z "$(find "$PW_BROWSERS" -path "*/ffmpeg-*" -print -quit)"
          python -c "from pathlib import Path; import sys; root=Path(sys.argv[1]); [print(path) for _, path in zip(range(20), (p for p in root.rglob('*') if p.is_file()))]" "$PW_BROWSERS"
          python -c "from pathlib import Path; import sys; root=Path(sys.argv[1]); print('Playwright browsers size MB:', round(sum(p.stat().st_size for p in root.rglob('*') if p.is_file()) / 1024 / 1024, 1))" "$PW_BROWSERS"

      - name: Install Playwright Chromium (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eux
          PW_SITE_BROWSERS="$(python -c "from pathlib import Path; import playwright; print(Path(playwright.__file__).resolve().parent / 'driver' / 'package' / '.local-browsers')")"
          rm -rf "$PW_SITE_BROWSERS"

          PW_BROWSERS="$RUNNER_TEMP/playwright-browsers"
          rm -rf "$PW_BROWSERS"
          mkdir -p "$PW_BROWSERS"
          PLAYWRIGHT_BROWSERS_PATH="$PW_BROWSERS" python -m playwright install --no-shell chromium
          rm -rf "$PW_BROWSERS"/ffmpeg-*

          echo "PW_BROWSERS=$PW_BROWSERS" >> "$GITHUB_ENV"
          test -d "$PW_BROWSERS"
          test ! -d "$PW_SITE_BROWSERS"
          test -z "$(find "$PW_BROWSERS" -path "*/chromium_headless_shell-*" -print -quit)"
          test -z "$(find "$PW_BROWSERS" -path "*/ffmpeg-*" -print -quit)"
          python -c "from pathlib import Path; import sys; root=Path(sys.argv[1]); [print(path) for _, path in zip(range(20), (p for p in root.rglob('*') if p.is_file()))]" "$PW_BROWSERS"
          python -c "from pathlib import Path; import sys; root=Path(sys.argv[1]); print('Playwright browsers size MB:', round(sum(p.stat().st_size for p in root.rglob('*') if p.is_file()) / 1024 / 1024, 1))" "$PW_BROWSERS"

      - name: Verify import main
        shell: bash
        run: |
          set -eux
          python -c "import main; print('main:', getattr(main, '__file__', None))"

      - name: Resolve python-docx templates path (site-packages)
        shell: bash
        run: |
          set -eux
          DOCX_TPL="$(python -c "import docx, os; print(os.path.join(os.path.dirname(docx.__file__), 'templates'))")"
          echo "DOCX_TPL=$DOCX_TPL" >> $GITHUB_ENV
          test -d "$DOCX_TPL"
          python -c "from pathlib import Path; import sys; [print(path.name) for _, path in zip(range(20), Path(sys.argv[1]).iterdir())]" "$DOCX_TPL"

      - name: Import Apple signing certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          set -eux
          CERT_PATH="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$IDENTITIES"
          CERT_ID="$(printf '%s\n' "$IDENTITIES" | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          test -n "$CERT_ID"
          echo "MACOS_CODESIGN_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      # ---------------- WINDOWS ----------------

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name $env:APP_NAME `
            --paths . `
            --hidden-import=main `
            --icon assets/app.ico `
            --add-data=utilities:utilities `
            --add-data=database:database `
            --add-data=retrade.ui:. `
            --add-data="$env:PW_BROWSERS;playwright/driver/package/.local-browsers" `
            --add-data=assets/app.ico:assets `
            --add-data=assets/app.jpg:assets `
            --add-data=assets/print.png:assets `
            --add-data=assets/sign.png:assets `
            --add-data=assets/updates.txt:assets `
            --add-data=templates/template.xlsx:templates `
            --add-data=templates/template.docx:templates `
            --add-data=templates/template_short.docx:templates `
            --add-data=templates/logs.log:templates `
            run.py

          if (-not (Test-Path "dist\$env:APP_NAME\_internal\retrade.ui") -and -not (Test-Path "dist\$env:APP_NAME\retrade.ui")) {
            throw "Missing bundled retrade.ui"
          }
          $pwRoot = "dist\$env:APP_NAME\_internal\playwright\driver\package\.local-browsers"
          if (-not (Test-Path $pwRoot)) {
            $pwRoot = "dist\$env:APP_NAME\playwright\driver\package\.local-browsers"
          }
          if (-not (Test-Path $pwRoot)) {
            throw "Missing bundled Playwright browsers"
          }
          $chromeExe = Get-ChildItem -Path $pwRoot -Recurse -Filter "chrome.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $chromeExe) {
            throw "Missing bundled Playwright Chromium executable"
          }
          & "dist\$env:APP_NAME\$env:APP_NAME.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Application smoke test failed"
          }

      - name: Build updater (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name updater `
            --icon assets/app.ico `
            --distpath "dist\$env:APP_NAME" `
            --workpath "build\updater" `
            updater.py

          if (-not (Test-Path "dist\$env:APP_NAME\updater.exe")) {
            throw "Missing updater.exe"
          }

      - name: Fix python-docx templates (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "dist\$env:APP_NAME"

          $dstTpl1 = Join-Path $root "docx\templates"
          Remove-Item -Recurse -Force $dstTpl1 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dstTpl1 | Out-Null
          Copy-Item -Recurse -Force "$env:DOCX_TPL\*" $dstTpl1

          New-Item -ItemType Directory -Force -Path (Join-Path $root "docx\parts") | Out-Null

          $dstTpl2 = Join-Path $root "_internal\docx\templates"
          Remove-Item -Recurse -Force $dstTpl2 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dstTpl2 | Out-Null
          Copy-Item -Recurse -Force "$env:DOCX_TPL\*" $dstTpl2

          New-Item -ItemType Directory -Force -Path (Join-Path $root "_internal\docx\parts") | Out-Null

          Write-Host "Docx templates copied:"
          Write-Host $dstTpl1
          Write-Host $dstTpl2

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $appRoot = Resolve-Path "dist\$env:APP_NAME"
          $preferredScript = Join-Path (Get-Location) "installer.iss"

          if (Test-Path $preferredScript) {
            $installerScript = (Resolve-Path $preferredScript).Path
          } else {
            $installerScript = Get-ChildItem -Path . -Recurse -File -Filter "*.iss" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch "\\(\.git|venv|\.venv)\\" } |
              Sort-Object FullName |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $installerScript) {
            throw "Missing Inno Setup script. Expected installer.iss or another *.iss file in the repository."
          }
          $iscc = Get-Command ISCC -ErrorAction SilentlyContinue
          if ($iscc) {
            $isccPath = $iscc.Source
          } else {
            $isccCandidates = @()
            $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
            $programFiles = [Environment]::GetEnvironmentVariable("ProgramFiles")
            foreach ($basePath in @($programFilesX86, $programFiles)) {
              foreach ($versionDir in @("Inno Setup 6", "Inno Setup 5")) {
                if ($basePath) {
                  $isccCandidates += Join-Path $basePath "$versionDir\ISCC.exe"
                }
              }
            }
            $isccPath = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $isccPath) {
            throw "Missing ISCC. Inno Setup must be available on the Windows runner."
          }

          Write-Host "ISCC: $isccPath"
          Write-Host "Inno Setup script: $installerScript"

          function Get-WorkspaceExeFiles {
            Get-ChildItem -Path . -Recurse -File -Filter "*.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch "\\(\.git|venv|\.venv)\\" }
          }

          $exeSnapshot = @{}
          Get-WorkspaceExeFiles | ForEach-Object { $exeSnapshot[$_.FullName] = $true }

          $appFileSnapshot = @{}
          Get-ChildItem -Path $appRoot -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { $appFileSnapshot[$_.FullName] = $true }

          $appDirSnapshot = @{}
          Get-ChildItem -Path $appRoot -Recurse -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { $appDirSnapshot[$_.FullName] = $true }

          & $isccPath $installerScript
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup build failed"
          }

          $bundledExeNames = @("${env:APP_NAME}.exe", "updater.exe")
          $setupCandidates = @(Get-WorkspaceExeFiles |
            Where-Object {
              -not $exeSnapshot.ContainsKey($_.FullName) -and
              $bundledExeNames -notcontains $_.Name
            } |
            Sort-Object LastWriteTimeUtc -Descending)

          if ($setupCandidates.Count -eq 0) {
            throw "Missing Inno Setup output exe"
          }

          $setupExe = $setupCandidates[0]
          Write-Host "Inno Setup output: $($setupExe.FullName)"

          Copy-Item -Force $setupExe.FullName $env:WINDOWS_SETUP_ASSET
          if (-not (Test-Path $env:WINDOWS_SETUP_ASSET)) {
            throw "Missing $env:WINDOWS_SETUP_ASSET"
          }

          Get-ChildItem -Path $appRoot -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { -not $appFileSnapshot.ContainsKey($_.FullName) } |
            Remove-Item -Force

          Get-ChildItem -Path $appRoot -Recurse -Directory -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Where-Object { -not $appDirSnapshot.ContainsKey($_.FullName) } |
            Remove-Item -Recurse -Force

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\$env:APP_NAME\*" -DestinationPath "$env:APP_NAME-windows.zip"

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            MyApp-windows.zip
            MyAppSetup.exe

      # ---------------- macOS ----------------

      - name: Build + Fix python-docx templates + Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eux
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            OUT="${APP_NAME}-macos-arm64.zip"
            TARCH="arm64"
          else
            OUT="${APP_NAME}-macos-x86_64.zip"
            TARCH="x86_64"
          fi

          pyinstaller --noconfirm --clean --windowed --name "${APP_NAME}" \
            --paths . \
            --hidden-import=main \
            --target-arch "${TARCH}" \
            --icon assets/app.icns \
            --add-data=assets/app.ico:assets \
            --add-data=assets/app.icns:assets \
            --add-data=assets/app.jpg:assets \
            --add-data=assets/sign.png:assets \
            --add-data=assets/print.png:assets \
            --add-data=assets/updates.txt:assets \
            --add-data=utilities:utilities \
            --add-data=database:database \
            --add-data=retrade.ui:. \
            --add-data=templates/template.xlsx:templates \
            --add-data=templates/template.docx:templates \
            --add-data=templates/template_short.docx:templates \
            --add-data=templates/logs.log:templates \
            run.py

          APP_PATH="$(find dist -maxdepth 4 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Contents/Resources/retrade.ui"

          PW_DST="$APP_PATH/Contents/Resources/playwright/driver/package/.local-browsers"
          rm -rf "$PW_DST"
          mkdir -p "$(dirname "$PW_DST")"
          cp -R "$PW_BROWSERS" "$PW_DST"

          test -d "$APP_PATH/Contents/Resources/playwright/driver/package/.local-browsers"
          test -n "$(find "$APP_PATH/Contents/Resources/playwright/driver/package/.local-browsers" -path "*/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing" -type f -print -quit)"

          DOCX_BASE="$APP_PATH/Contents/Frameworks/docx"
          mkdir -p "$DOCX_BASE/templates"
          mkdir -p "$DOCX_BASE/parts"

          cp -R "$DOCX_TPL/"* "$DOCX_BASE/templates/"

          test -d "$DOCX_BASE/parts"
          test -f "$DOCX_BASE/templates/default-header.xml"
          python -c "from pathlib import Path; import sys; [print(path.name) for _, path in zip(range(20), Path(sys.argv[1]).joinpath('templates').iterdir())]" "$DOCX_BASE"

          xattr -cr "$APP_PATH"
          if [ -n "${MACOS_CODESIGN_IDENTITY:-}" ]; then
            : "${APPLE_ID:?Missing APPLE_ID secret}"
            : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"
            : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD secret}"

            codesign --force --deep --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "$APP_PATH"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            NOTARY_ZIP="$RUNNER_TEMP/${APP_NAME}-notary-${TARCH}.zip"
            ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ZIP"
            xcrun notarytool submit "$NOTARY_ZIP" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait
            xcrun stapler staple "$APP_PATH"
            xcrun stapler validate "$APP_PATH"
            spctl --assess --type execute --verbose=4 "$APP_PATH"
          else
            codesign --force --deep --sign - "$APP_PATH"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          fi

          "$APP_PATH/Contents/MacOS/${APP_NAME}" --smoke-test

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT"

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: MyApp-macos-*.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIP_FILES < <(find artifacts -type f -name "*.zip" | sort)
          printf '%s\n' "${ZIP_FILES[@]}"
          test "${#ZIP_FILES[@]}" -ge 3
          cp "${ZIP_FILES[@]}" .
          SETUP_FILE="$(find artifacts -type f -name "MyAppSetup.exe" -print -quit)"
          test -n "$SETUP_FILE"
          cp "$SETUP_FILE" .
          ls -la MyAppSetup.exe *.zip
          test -f "MyAppSetup.exe"
          test -f "MyApp-windows.zip"
          test -f "MyApp-macos-arm64.zip"
          test -f "MyApp-macos-x86_64.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            MyAppSetup.exe
            MyApp-windows.zip
            MyApp-macos-arm64.zip
            MyApp-macos-x86_64.zip
