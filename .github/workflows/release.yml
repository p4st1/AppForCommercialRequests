name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: MyApp
  PYTHON_VERSION: "3.11"

jobs:
  verify:
    name: Verify (tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install test deps
        shell: bash
        run: |
          set -eux
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set -eux
          python -m unittest discover -s tests -v

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos-arm64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Sanity check files
        shell: bash
        run: |
          set -eux
          test -f run.py
          test -f main.py
          test -f requirements.txt
          test -f retrade.ui
          test -d utilities
          test -d database
          test -d templates
          test -f templates/template.xlsx
          test -f templates/template.docx
          test -f templates/template_short.docx
          test -f templates/logs.log
          test -d assets
          test -f assets/app.ico
          test -f assets/app.icns
          test -f assets/app.jpg
          test -f assets/print.png
          test -f assets/sign.png
          test -f assets/updates.txt

      - name: Install deps
        shell: bash
        run: |
          set -eux
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -U pyinstaller PySide6 python-docx
          PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium

      - name: Resolve Playwright browsers path (site-packages)
        shell: bash
        run: |
          set -eux
          PW_BROWSERS="$(python -c "from pathlib import Path; import playwright; print(Path(playwright.__file__).resolve().parent / 'driver' / 'package' / '.local-browsers')")"
          echo "PW_BROWSERS=$PW_BROWSERS" >> "$GITHUB_ENV"
          test -d "$PW_BROWSERS"
          find "$PW_BROWSERS" -maxdepth 4 -type f | head -n 20

      - name: Verify import main
        shell: bash
        run: |
          set -eux
          python -c "import main; print('main:', getattr(main, '__file__', None))"

      - name: Resolve python-docx templates path (site-packages)
        shell: bash
        run: |
          set -eux
          DOCX_TPL="$(python -c "import docx, os; print(os.path.join(os.path.dirname(docx.__file__), 'templates'))")"
          echo "DOCX_TPL=$DOCX_TPL" >> $GITHUB_ENV
          test -d "$DOCX_TPL"
          ls -la "$DOCX_TPL" | head -n 20

      # ---------------- WINDOWS ----------------

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name $env:APP_NAME `
            --paths . `
            --hidden-import=main `
            --icon assets/app.ico `
            --add-data=utilities:utilities `
            --add-data=database:database `
            --add-data=retrade.ui:. `
            --add-data="$env:PW_BROWSERS;playwright/driver/package/.local-browsers" `
            --add-data=assets/app.ico:assets `
            --add-data=assets/app.jpg:assets `
            --add-data=assets/print.png:assets `
            --add-data=assets/sign.png:assets `
            --add-data=assets/updates.txt:assets `
            --add-data=templates/template.xlsx:templates `
            --add-data=templates/template.docx:templates `
            --add-data=templates/template_short.docx:templates `
            --add-data=templates/logs.log:templates `
            run.py

          if (-not (Test-Path "dist\$env:APP_NAME\_internal\retrade.ui") -and -not (Test-Path "dist\$env:APP_NAME\retrade.ui")) {
            throw "Missing bundled retrade.ui"
          }
          $pwRoot = "dist\$env:APP_NAME\_internal\playwright\driver\package\.local-browsers"
          if (-not (Test-Path $pwRoot)) {
            $pwRoot = "dist\$env:APP_NAME\playwright\driver\package\.local-browsers"
          }
          if (-not (Test-Path $pwRoot)) {
            throw "Missing bundled Playwright browsers"
          }
          $chromeExe = Get-ChildItem -Path $pwRoot -Recurse -Filter "chrome.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $chromeExe) {
            throw "Missing bundled Playwright Chromium executable"
          }

      - name: Fix python-docx templates (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "dist\$env:APP_NAME"

          $dstTpl1 = Join-Path $root "docx\templates"
          Remove-Item -Recurse -Force $dstTpl1 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dstTpl1 | Out-Null
          Copy-Item -Recurse -Force "$env:DOCX_TPL\*" $dstTpl1

          New-Item -ItemType Directory -Force -Path (Join-Path $root "docx\parts") | Out-Null

          $dstTpl2 = Join-Path $root "_internal\docx\templates"
          Remove-Item -Recurse -Force $dstTpl2 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dstTpl2 | Out-Null
          Copy-Item -Recurse -Force "$env:DOCX_TPL\*" $dstTpl2

          New-Item -ItemType Directory -Force -Path (Join-Path $root "_internal\docx\parts") | Out-Null

          Write-Host "Docx templates copied:"
          Write-Host $dstTpl1
          Write-Host $dstTpl2

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\$env:APP_NAME\*" -DestinationPath "$env:APP_NAME-windows.zip"

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: MyApp-windows.zip

      # ---------------- macOS ----------------

      - name: Build + Fix python-docx templates + Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eux
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            OUT="${APP_NAME}-macos-arm64.zip"
            TARCH="arm64"
          else
            OUT="${APP_NAME}-macos-x86_64.zip"
            TARCH="x86_64"
          fi

          pyinstaller --noconfirm --clean --windowed --name "${APP_NAME}" \
            --paths . \
            --hidden-import=main \
            --target-arch "${TARCH}" \
            --icon assets/app.icns \
            --add-data=assets/app.ico:assets \
            --add-data=assets/app.icns:assets \
            --add-data=assets/app.jpg:assets \
            --add-data=assets/sign.png:assets \
            --add-data=assets/print.png:assets \
            --add-data=assets/updates.txt:assets \
            --add-data=utilities:utilities \
            --add-data=database:database \
            --add-data=retrade.ui:. \
            --add-data="${PW_BROWSERS}:playwright/driver/package/.local-browsers" \
            --add-data=templates/template.xlsx:templates \
            --add-data=templates/template.docx:templates \
            --add-data=templates/template_short.docx:templates \
            --add-data=templates/logs.log:templates \
            run.py

          APP_PATH="$(find dist -maxdepth 4 -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Contents/Resources/retrade.ui"
          test -d "$APP_PATH/Contents/Resources/playwright/driver/package/.local-browsers"
          test -n "$(find "$APP_PATH/Contents/Resources/playwright/driver/package/.local-browsers" -path "*/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing" -type f -print -quit)"

          DOCX_BASE="$APP_PATH/Contents/Frameworks/docx"
          mkdir -p "$DOCX_BASE/templates"
          mkdir -p "$DOCX_BASE/parts"

          cp -R "$DOCX_TPL/"* "$DOCX_BASE/templates/"

          test -d "$DOCX_BASE/parts"
          test -f "$DOCX_BASE/templates/default-header.xml"
          ls -la "$DOCX_BASE/templates" | head -n 20

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT"

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: MyApp-macos-*.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect zips
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIP_FILES < <(find artifacts -type f -name "*.zip" | sort)
          printf '%s\n' "${ZIP_FILES[@]}"
          test "${#ZIP_FILES[@]}" -ge 3
          cp "${ZIP_FILES[@]}" .
          ls -la *.zip
          test -f "MyApp-windows.zip"
          test -f "MyApp-macos-arm64.zip"
          test -f "MyApp-macos-x86_64.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            MyApp-windows.zip
            MyApp-macos-arm64.zip
            MyApp-macos-x86_64.zip
