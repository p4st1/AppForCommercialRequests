name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --windowed --name MyApp --collect-all PySide6 --add-data "utilities;utilities" --add-data "database;database" run.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eux
          pyinstaller --noconfirm --clean --windowed --name MyApp --add-data "utilities:utilities" --add-data "database:database" run.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell Compress-Archive -Path dist\MyApp\* -DestinationPath MyApp-windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent MyApp.app ../MyApp-macos.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MyApp-windows.zip
            MyApp-macos.zip

