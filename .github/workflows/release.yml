name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: MyApp
  PYTHON_VERSION: "3.11"

jobs:

  # =========================================================
  # TESTS
  # =========================================================

  verify:
    name: Verify (tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set -eux
          python -m unittest discover -s tests -v

  # =========================================================
  # BUILD
  # =========================================================

  build:
    name: Build (${{ matrix.name }})
    needs: verify

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: windows
            os: windows-latest

          - name: macos-arm64
            os: macos-15

          - name: macos-x86_64
            os: macos-15-intel

    runs-on: ${{ matrix.os }}

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # =====================================================
      # INSTALL
      # =====================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install \
            nuitka \
            ordered-set \
            zstandard

      # =====================================================
      # SANITY CHECK
      # =====================================================

      - name: Verify project structure
        shell: bash
        run: |
          set -eux

          test -f run.py
          test -f main.py
          test -f requirements.txt

          test -d utilities
          test -d database
          test -d templates
          test -d assets

          test -f retrade.ui

      # =====================================================
      # WINDOWS BUILD
      # =====================================================

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |

          python -m nuitka `
            --standalone `
            --onefile `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --msvc=latest `
            --lto=yes `
            --clang `
            --output-filename="$env:APP_NAME.exe" `
            --windows-icon-from-ico=assets/app.ico `
            --include-data-dir=utilities=utilities `
            --include-data-dir=database=database `
            --include-data-dir=templates=templates `
            --include-data-dir=assets=assets `
            --include-data-file=retrade.ui=retrade.ui `
            --include-package-data=docx `
            run.py

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |

          mkdir release

          Copy-Item `
            ".\run.dist\$env:APP_NAME.exe" `
            ".\release\$env:APP_NAME.exe"

          Compress-Archive `
            -Path ".\release\*" `
            -DestinationPath "$env:APP_NAME-windows.zip"

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: MyApp-windows.zip

      # =====================================================
      # MACOS BUILD
      # =====================================================

      - name: Build macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eux

          ARCH="$(uname -m)"

          if [ "$ARCH" = "arm64" ]; then
            OUT="${APP_NAME}-macos-arm64.zip"
          else
            OUT="${APP_NAME}-macos-x86_64.zip"
          fi

          python -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --enable-plugin=pyside6 \
            --macos-create-app-bundle \
            --macos-app-icon=assets/app.icns \
            --lto=yes \
            --clang \
            --include-data-dir=utilities=utilities \
            --include-data-dir=database=database \
            --include-data-dir=templates=templates \
            --include-data-dir=assets=assets \
            --include-data-file=retrade.ui=retrade.ui \
            --include-package-data=docx \
            run.py

          APP_PATH="$(find . -name '*.app' | head -n 1)"

          test -n "$APP_PATH"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$OUT"

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: MyApp-macos-*.zip

  # =========================================================
  # RELEASE
  # =========================================================

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        shell: bash
        run: |
          set -eux

          find artifacts -type f

          cp artifacts/windows/*.zip .
          cp artifacts/macos-arm64/*.zip .
          cp artifacts/macos-x86_64/*.zip .

          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

          files: |
            MyApp-windows.zip
            MyApp-macos-arm64.zip
            MyApp-macos-x86_64.zip