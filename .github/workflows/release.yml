name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: MyApp

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos-arm64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Sanity check files
        shell: bash
        run: |
          set -eux
          test -f run.py
          test -f main.py
          test -f requirements.txt
          test -d utilities
          test -d database
          test -d templates
          test -f templates/template.xlsx
          test -f templates/logs.log
          test -d assets
          test -f assets/app.ico
          test -f assets/app.icns

      - name: Install deps
        shell: bash
        run: |
          set -eux
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -U pyinstaller PySide6 python-docx

      - name: Verify import main
        shell: bash
        run: |
          set -eux
          python -c "import main; print('main:', getattr(main, '__file__', None))"

      - name: Resolve python-docx templates path (site-packages)
        shell: bash
        run: |
          set -eux
          DOCX_TPL="$(python -c "import docx, os; print(os.path.join(os.path.dirname(docx.__file__), 'templates'))")"
          echo "DOCX_TPL=$DOCX_TPL" >> $GITHUB_ENV
          test -d "$DOCX_TPL"
          ls -la "$DOCX_TPL" | head -n 20

      # ---------------- WINDOWS ----------------

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name $env:APP_NAME `
            --paths . `
            --hidden-import=main `
            --icon assets/app.ico `
            --add-data=utilities:utilities `
            --add-data=database:database `
            --add-data=templates/template.xlsx:templates `
            --add-data=templates/logs.log:templates `
            run.py

      - name: Fix python-docx templates (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "dist\$env:APP_NAME"

          # Вариант 1: docx рядом с бинарником (редко, но бывает)
          $dst1 = Join-Path $root "docx\templates"
          New-Item -ItemType Directory -Force -Path $dst1 | Out-Null
          Copy-Item -Recurse -Force "$env:DOCX_TPL\*" $dst1

          # Вариант 2: PyInstaller кладёт либы в _internal
          $dst2 = Join-Path $root "_internal\docx\templates"
          New-Item -ItemType Directory -Force -Path $dst2 | Out-Null
          Copy-Item -Recurse -Force "$env:DOCX_TPL\*" $dst2

          Write-Host "Copied docx templates to:"
          Write-Host $dst1
          Write-Host $dst2

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\$env:APP_NAME\*" -DestinationPath "$env:APP_NAME-windows.zip"

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: MyApp-windows.zip

      # ---------------- macOS ----------------

      - name: Build + Fix python-docx templates + Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eux
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            OUT="${APP_NAME}-macos-arm64.zip"
            TARCH="arm64"
          else
            OUT="${APP_NAME}-macos-x86_64.zip"
            TARCH="x86_64"
          fi

          pyinstaller --noconfirm --clean --windowed --name "${APP_NAME}" \
            --paths . \
            --hidden-import=main \
            --target-arch "${TARCH}" \
            --icon assets/app.icns \
            --add-data=utilities:utilities \
            --add-data=database:database \
            --add-data=templates/template.xlsx:templates \
            --add-data=templates/logs.log:templates \
            run.py

          APP_PATH="$(find dist -maxdepth 4 -name '*.app' | head -n 1)"
          test -n "$APP_PATH"

          # КЛЮЧЕВОЙ ФИКС: кладём templates туда, где python-docx их ищет в frozen app
          DST="$APP_PATH/Contents/Frameworks/docx/templates"
          mkdir -p "$DST"
          cp -R "$DOCX_TPL/"* "$DST/"

          # проверка, что файл реально появился
          test -f "$DST/default-header.xml"
          ls -la "$DST" | head -n 30

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT"

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: MyApp-macos-*.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect zips
        shell: bash
        run: |
          set -eux
          find artifacts -type f -name "*.zip" -print
          cp artifacts/**/**.zip . || true
          ls -la *.zip
          test -f "MyApp-windows.zip"
          test -f "MyApp-macos-arm64.zip"
          test -f "MyApp-macos-x86_64.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MyApp-windows.zip
            MyApp-macos-arm64.zip
            MyApp-macos-x86_64.zip
